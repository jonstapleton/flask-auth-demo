{% extends "base.html" %}
{% block body %}
<div class="container"></div>
<form method="POST" action="/">
  <fieldset>
    <label>
      Email
      <input
        name="email"
        type="text"
      />
    </label>
    <label>
      Password
      <input
        type="password"
        name="password"
      />
    </label>
  </fieldset>

  <input
    type="submit"
    value="Login"
  />
</form>
</div>
{% endblock %}
